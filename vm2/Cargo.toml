[workspace]
members = [
    # Main published library crates
    "crates/vm2-interface",
    "crates/vm2",
    # Testing crates
    "tests/afl-fuzz"
]
resolver = "2"

[workspace.package]
version = "0.7.0" # x-release-please-version
edition = "2021"
authors = ["The Matter Labs Team <hello@matterlabs.dev>"]
homepage = "https://zksync.io/"
repository = "https://github.com/matter-labs/zksync-protocol"
license = "MIT OR Apache-2.0"
keywords = ["blockchain", "zksync"]
categories = ["cryptography"]

[workspace.dependencies]
# "External" dependencies
afl = "0.15"
anyhow = "1"
arbitrary = "1"
divan = "0.1"
enum_dispatch = "0.3"
pretty_assertions = "1.4.0"
primitive-types = "0.12.1"
proptest = "1.4"

# "Internal" dependencies
#
# Vendored into this repository, so these resolve through the `protocol/`
# workspace's `crates/` tree rather than through a git tag. That is
# the point of keeping vm2 here: a protocol change and the vm2 change it
# requires land in one commit, and CI builds vm2 against the working tree
# instead of the last published tag.
#
# No `version` is given on purpose. These crates are not on crates.io (the
# protocol workspace has a git-only `airbender-crypto` dependency), and vm2 is
# not published either -- see the note above `publish-to-crates-io` in
# `.github/workflows/release.yaml`. A bare path dependency keeps the two
# workspaces' version numbers independent: vm2 stays on its own 0.x line while
# the protocol crates move with the 0.153.x release train.
zkevm_opcode_defs = { path = "../protocol/crates/zkevm_opcode_defs" }
zk_evm_abstractions = { path = "../protocol/crates/zk_evm_abstractions" }
zk_evm = { path = "../protocol/crates/zk_evm" }
zkevm-assembly = { path = "../protocol/crates/zkEVM-assembly" }

# Dependencies within the workspace
zksync_vm2_interface = { version = "=0.7.0", path = "crates/vm2-interface" }
zksync_vm2 = { version = "=0.7.0", path = "crates/vm2" }

[workspace.lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
must_use_candidate = "allow"
module_name_repetitions = "allow"
inline_always = "allow"
struct_field_names = "allow"
