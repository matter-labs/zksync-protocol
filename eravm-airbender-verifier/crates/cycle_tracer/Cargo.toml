[package]
name = "zksync-era-airbender-cycles-tracer"
description = "Passive vm2 tracer that fills the Airbender cycle-cost model's feature vector"
version.workspace = true
edition.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

# The fast-VM (`zksync_vm2`) half of the cycle estimator, and nothing else: a
# passive tracer that fills the `FeatureVector` schema defined in the VM-agnostic
# `zksync-era-airbender-cycles-estimator` crate. Estimation itself lives entirely
# in that crate -- call `estimate_from_features(tracer.snapshot(), ..)` there.
# Split out so consumers that only need the model / feature schema / cost table
# (e.g. zksync-era) do not pull `zksync_vm2`.
[dependencies]
zksync-era-airbender-cycles-estimator.workspace = true
zksync_vm2.workspace = true
