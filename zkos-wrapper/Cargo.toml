#     "proof_utils", "blake2_with_compression"
# ], default-features = false}
# execution_utils = { path = "../zksync-airbender/execution_utils", package = "execution_utils", features = [
#     "prover"
# ], default-features = false}
# setups = { path = "../zksync-airbender/circuit_defs/setups", package = "setups"}
# mersenne_field = { path = "../zksync-airbender/field", package = "field"}
# zkos_verifier_generator = { path = "../zksync-airbender/verifier_generator", package = "verifier_generator"}
# prover = { path = "../zksync-airbender/prover", package = "prover"}

serde_json = { version = "*" }
serde = { version = "1", default-features = false, features = [
  "derive",
  "alloc",
] }
bincode = { version = "2", features = ["serde"] }
clap = { version = "4.5.21", features = ["derive"] }
sha3 = "*"
rand = "0.8"

# Used for GPU proving. Paths into `../crypto-gpu/` for the same reason: the
# shivini FRI lift is on the GPU trunk (#3), and `PlonkSnarkWrapperLogN` -- the
# domain-size-generic snark wrapper this workspace instantiates at
# `L1_VERIFIER_DOMAIN_SIZE_LOG` -- is now in `proof-compression` there.
shivini = { path = "../crypto-gpu/crates/shivini" }
proof-compression = { path = "../crypto-gpu/crates/proof-compression" }
zksync-gpu-prover = { package = "zksync-gpu-prover", path = "../crypto-gpu/crates/gpu-prover" }

# shivini = { path = "../zksync-crypto-gpu/crates/shivini", package = "shivini" }
# proof-compression = { path = "../zksync-crypto-gpu/crates/proof-compression", package = "proof-compression" }
# zksync-gpu-prover = { path = "../zksync-crypto-gpu/crates/gpu-prover", package = "zksync-gpu-prover" }

tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1"

[profile.release.package."blake2_with_compression_verifier"]
opt-level = 1
codegen-units = 256
overflow-checks = true

[profile.release.package."zkos-wrapper"]
opt-level = 2

[profile.release]
lto = false
# This is needed for zksync-airbender crates to compile in a reasonable time for x86-64-unknown-linux-gnu
overflow-checks = true

