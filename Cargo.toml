[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
# All the packages in the workspace should have the same version
version = "0.153.14"                                            # x-release-please-version
edition = "2021"
authors = ["The Matter Labs Team <hello@matterlabs.dev>"]
homepage = "https://zksync.io/"
repository = "https://github.com/matter-labs/zksync-protocol/"
license = "MIT OR Apache-2.0"
keywords = ["blockchain", "zksync"]
categories = ["cryptography"]

[workspace.dependencies]
circuit_definitions = { version = "=0.153.14", path = "crates/circuit_definitions" }
circuit_encodings = { version = "=0.153.14", path = "crates/circuit_encodings" }
circuit_sequencer_api = { version = "=0.153.14", path = "crates/circuit_sequencer_api" }
cfg-if = "1"
kzg = { version = "=0.153.14", path = "crates/kzg", package = "zksync_kzg" }
quickcheck = "1"
tiny-keccak = "2"
zk_evm = { version = "=0.153.14", path = "crates/zk_evm" }
zk_evm_abstractions = { version = "=0.153.14", path = "crates/zk_evm_abstractions" }
zkevm_circuits = { version = "=0.153.14", path = "crates/zkevm_circuits" }
zkevm_opcode_defs = { version = "=0.153.14", path = "crates/zkevm_opcode_defs" }
zkevm_test_harness = { version = "=0.153.14", path = "crates/zkevm_test_harness" }
zkevm-assembly = { version = "=0.153.14", path = "crates/zkEVM-assembly" }

airbender-crypto = { git = "https://github.com/matter-labs/airbender-platform", tag = "v0.2.3" }

# `zksync-crypto` workspace dependencies
snark_wrapper = "=0.32.10"
bellman = { package = "zksync_bellman", version = "=0.32.10" }
boojum = "=0.32.10"
cs_derive = { package = "zksync_cs_derive", version = "=0.32.10" }
zksync_pairing = "=0.32.10"

# TEMPORARY: boojum 0.32.10 as published on crates.io still carries
# `#![feature(array_chunks)]`, which nightly removed. The fix is already on
# zksync-crypto main (commit cb466ac, "feat: updated nightly version") but has
# not been released. Remove this whole section once boojum > 0.32.10 is
# published and the versions above are bumped to it.
[patch.crates-io]
boojum = { git = "https://github.com/matter-labs/zksync-crypto", rev = "c0a717cfef79b6edb92a3644dd92d6ac03e3b4a2" }
snark_wrapper = { git = "https://github.com/matter-labs/zksync-crypto", rev = "c0a717cfef79b6edb92a3644dd92d6ac03e3b4a2" }
zksync_bellman = { git = "https://github.com/matter-labs/zksync-crypto", rev = "c0a717cfef79b6edb92a3644dd92d6ac03e3b4a2" }
zksync_pairing = { git = "https://github.com/matter-labs/zksync-crypto", rev = "c0a717cfef79b6edb92a3644dd92d6ac03e3b4a2" }
